name: Weekly Climbing Logbook Sync

on:
  schedule:
    # 17:00 UTC Monday = 9 AM PST / 10 AM PDT.
    - cron: "0 17 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climbing-logbook-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify Kilter secrets are available
        env:
          KILTER_USERNAME: ${{ secrets.KILTER_USERNAME }}
          KILTER_PASSWORD: ${{ secrets.KILTER_PASSWORD }}
        run: |
          if [ -n "$KILTER_USERNAME" ]; then
            echo "KILTER_USERNAME: SET"
          else
            echo "KILTER_USERNAME: MISSING"
          fi

          if [ -n "$KILTER_PASSWORD" ]; then
            echo "KILTER_PASSWORD: SET"
          else
            echo "KILTER_PASSWORD: MISSING"
          fi
      - name: Sync board logbooks and update Google Sheets
        env:
          KILTER_USERNAME: ${{ secrets.KILTER_USERNAME }}
          KILTER_PASSWORD: ${{ secrets.KILTER_PASSWORD }}
          TENSION_USERNAME: ${{ secrets.TENSION_USERNAME }}
          TENSION_PASSWORD: ${{ secrets.TENSION_PASSWORD }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python tracker.py
